<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Retirement Countdown</title>

    <style>
        :root {
            --background-color: #0b1f33;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            background: var(--background-color);
            color: var(--text-color);

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            overflow: hidden;

            transition:
                background-color 0.25s ease,
                color 0.25s ease;
        }

        /* =========================
           ACCESSIBILITY
        ========================== */

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        :focus-visible {
            outline: 3px solid currentColor;
            outline-offset: 4px;
        }

        /* =========================
           FIREWORKS
        ========================== */

        #fireworksCanvas {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            z-index: 5;
        }

        /* =========================
           COLOR PICKER
        ========================== */

        .color-control {
            position: fixed;

            top: max(18px, env(safe-area-inset-top));
            right: max(18px, env(safe-area-inset-right));

            z-index: 20;
        }

        .color-picker {
            width: 46px;
            height: 46px;

            padding: 0;

            border: 3px solid var(--text-color);
            border-radius: 50%;

            background: transparent;

            cursor: pointer;

            box-shadow:
                0 4px 14px rgba(0, 0, 0, 0.20);

            opacity: 0.7;

            transition:
                opacity 0.2s ease,
                transform 0.2s ease;
        }

        .color-picker:hover,
        .color-picker:focus-visible {
            opacity: 1;
        }

        .color-picker:active {
            transform: scale(0.94);
        }

        .color-picker::-webkit-color-swatch-wrapper {
            padding: 3px;
        }

        .color-picker::-webkit-color-swatch {
            border: 0;
            border-radius: 50%;
        }

        .color-picker::-moz-color-swatch {
            border: 0;
            border-radius: 50%;
        }

        /* =========================
           MAIN PAGE
        ========================== */

        .page {
            position: relative;

            z-index: 10;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding:
                max(20px, env(safe-area-inset-top))
                max(20px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(20px, env(safe-area-inset-left));
        }

        .countdown {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .units {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: clamp(12px, 2vw, 42px);

            white-space: nowrap;
        }

        .unit {
            display: flex;
            align-items: baseline;
            justify-content: center;

            gap: 0.18em;

            line-height: 1;
        }

        .value {
            font-weight: 800;
            letter-spacing: -0.06em;

            font-variant-numeric: tabular-nums;
        }

        .label {
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        /* =========================
           SIX UNITS
        ========================== */

        .count-6 .value {
            font-size: clamp(2rem, 5.1vw, 6.5rem);
        }

        .count-6 .label {
            font-size: clamp(0.8rem, 1.5vw, 2rem);
        }

        /* =========================
           FIVE UNITS
        ========================== */

        .count-5 .value {
            font-size: clamp(2.5rem, 6vw, 8rem);
        }

        .count-5 .label {
            font-size: clamp(0.9rem, 1.7vw, 2.2rem);
        }

        /* =========================
           FOUR UNITS
        ========================== */

        .count-4 .value {
            font-size: clamp(3rem, 7.5vw, 10rem);
        }

        .count-4 .label {
            font-size: clamp(1rem, 2vw, 2.5rem);
        }

        /* =========================
           THREE UNITS
        ========================== */

        .count-3 .value {
            font-size: clamp(4rem, 11vw, 13rem);
        }

        .count-3 .label {
            font-size: clamp(1.1rem, 2.5vw, 3rem);
        }

        /* =========================
           TWO UNITS
        ========================== */

        .count-2 .units {
            gap: clamp(25px, 6vw, 100px);
        }

        .count-2 .value {
            font-size: clamp(6rem, 19vw, 20rem);
        }

        .count-2 .label {
            font-size: clamp(1.3rem, 3.5vw, 4rem);
        }

        /* =========================
           ONLY SECONDS
        ========================== */

        .count-1 .units {
            width: 100%;
            height: 100%;
        }

        .count-1 .unit {
            width: 100%;
            height: 100%;

            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 0;
        }

        .count-1 .value {
            font-size: min(48vw, 62vh);
            line-height: 0.82;
        }

        .count-1 .label {
            margin-top: 0.18em;

            font-size: min(9vw, 9vh);

            line-height: 1;
        }

        /* =========================
           RETIRED
        ========================== */

        .retired {
            display: none;

            width: 100%;
            height: 100%;

            align-items: center;
            justify-content: center;

            font-weight: 900;

            font-size: min(20vw, 38vh);

            line-height: 0.85;

            letter-spacing: -0.075em;

            text-align: center;

            text-shadow:
                0 4px 20px rgba(0, 0, 0, 0.35);
        }

        .is-retired .units {
            display: none;
        }

        .is-retired .retired {
            display: flex;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 760px) {

            .page {
                padding: 24px 14px;
            }

            .color-control {
                top: max(12px, env(safe-area-inset-top));
                right: max(12px, env(safe-area-inset-right));
            }

            .color-picker {
                width: 40px;
                height: 40px;
            }

            .units {
                flex-wrap: wrap;

                gap:
                    clamp(14px, 4vw, 25px)
                    clamp(16px, 5vw, 30px);

                white-space: normal;
            }

            .unit {
                flex-direction: column;
                align-items: center;

                gap: 4px;
            }

            .count-6 .value,
            .count-5 .value {
                font-size: clamp(2.7rem, 15vw, 5rem);
            }

            .count-6 .label,
            .count-5 .label {
                font-size: clamp(0.8rem, 4vw, 1.15rem);
            }

            .count-4 .value {
                font-size: clamp(3.4rem, 18vw, 6rem);
            }

            .count-4 .label {
                font-size: clamp(0.9rem, 4vw, 1.3rem);
            }

            .count-3 .value {
                font-size: clamp(4rem, 24vw, 7rem);
            }

            .count-3 .label {
                font-size: clamp(1rem, 5vw, 1.5rem);
            }

            .count-2 .value {
                font-size: clamp(6rem, 35vw, 10rem);
            }

            .count-2 .label {
                font-size: clamp(1.2rem, 6vw, 2rem);
            }

            .count-1 .value {
                font-size: min(62vw, 55vh);
            }

            .count-1 .label {
                font-size: min(13vw, 9vh);
            }

            .retired {
                font-size: min(24vw, 22vh);

                overflow-wrap: anywhere;
            }
        }

        /* =========================
           REDUCED MOTION
        ========================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }

    </style>
</head>

<body>

    <h1 class="visually-hidden">
        Retirement Countdown
    </h1>

    <!-- Fireworks -->
    <canvas
        id="fireworksCanvas"
        aria-hidden="true"
    ></canvas>

    <!-- Background Color Picker -->
    <div class="color-control">

        <label
            for="backgroundColor"
            class="visually-hidden"
        >
            Choose background color
        </label>

        <input
            id="backgroundColor"
            class="color-picker"
            type="color"
            value="#0b1f33"
            aria-label="Choose background color"
            title="Change background color"
        >

    </div>

    <!-- Countdown -->
    <main class="page">

        <section
            id="countdown"
            class="countdown"
            role="timer"
            aria-live="off"
            aria-label="Retirement countdown"
        >

            <div
                id="units"
                class="units"
            ></div>

            <div
                id="retired"
                class="retired"
                aria-hidden="true"
            >
                RETIRED
            </div>

        </section>

    </main>


    <script>

        /* ==========================================================
           RETIREMENT DATE

           CHANGE THIS LATER.

           Current test:
           September 15, 2026
           5:30 PM Eastern
        ========================================================== */

        const RETIREMENT_DATE =
            new Date("2029-06-30T17:30:00-04:00");


        /* ==========================================================
           BACKGROUND COLOR
        ========================================================== */

        const DEFAULT_BACKGROUND = "#0b1f33";

        const colorPicker =
            document.getElementById("backgroundColor");


        function getContrastColor(hexColor) {

            const hex =
                hexColor.replace("#", "");

            const red =
                parseInt(hex.substring(0, 2), 16);

            const green =
                parseInt(hex.substring(2, 4), 16);

            const blue =
                parseInt(hex.substring(4, 6), 16);


            const rgb = [
                red / 255,
                green / 255,
                blue / 255
            ].map(value => {

                return value <= 0.03928
                    ? value / 12.92
                    : Math.pow(
                        (value + 0.055) / 1.055,
                        2.4
                    );

            });


            const luminance =
                0.2126 * rgb[0] +
                0.7152 * rgb[1] +
                0.0722 * rgb[2];


            const contrastWithWhite =
                1.05 / (luminance + 0.05);

            const contrastWithBlack =
                (luminance + 0.05) / 0.05;


            return contrastWithWhite >= contrastWithBlack
                ? "#ffffff"
                : "#000000";
        }


        function applyBackgroundColor(color) {

            const textColor =
                getContrastColor(color);


            document.documentElement.style.setProperty(
                "--background-color",
                color
            );


            document.documentElement.style.setProperty(
                "--text-color",
                textColor
            );


            colorPicker.value = color;


            localStorage.setItem(
                "retirementBackgroundColor",
                color
            );
        }


        const savedBackground =
            localStorage.getItem(
                "retirementBackgroundColor"
            );


        applyBackgroundColor(
            savedBackground || DEFAULT_BACKGROUND
        );


        colorPicker.addEventListener(
            "input",
            event => {

                applyBackgroundColor(
                    event.target.value
                );

            }
        );


        /* ==========================================================
           COUNTDOWN
        ========================================================== */

        const countdown =
            document.getElementById("countdown");

        const unitsContainer =
            document.getElementById("units");

        const retiredElement =
            document.getElementById("retired");


        function getTimeRemaining(now, target) {

            if (now >= target) {

                return {
                    years: 0,
                    months: 0,
                    days: 0,
                    hours: 0,
                    minutes: 0,
                    seconds: 0,
                    complete: true
                };

            }


            let cursor =
                new Date(now.getTime());


            let years = 0;
            let months = 0;
            let days = 0;


            /* YEARS */

            while (true) {

                const next =
                    new Date(cursor.getTime());

                next.setFullYear(
                    next.getFullYear() + 1
                );


                if (next <= target) {

                    years++;
                    cursor = next;

                } else {

                    break;

                }

            }


            /* MONTHS */

            while (true) {

                const next =
                    new Date(cursor.getTime());

                next.setMonth(
                    next.getMonth() + 1
                );


                if (next <= target) {

                    months++;
                    cursor = next;

                } else {

                    break;

                }

            }


            /* DAYS */

            while (true) {

                const next =
                    new Date(cursor.getTime());

                next.setDate(
                    next.getDate() + 1
                );


                if (next <= target) {

                    days++;
                    cursor = next;

                } else {

                    break;

                }

            }


            let remainingMilliseconds =
                target.getTime() -
                cursor.getTime();


            const hours =
                Math.floor(
                    remainingMilliseconds /
                    (1000 * 60 * 60)
                );


            remainingMilliseconds -=
                hours *
                (1000 * 60 * 60);


            const minutes =
                Math.floor(
                    remainingMilliseconds /
                    (1000 * 60)
                );


            remainingMilliseconds -=
                minutes *
                (1000 * 60);


            const seconds =
                Math.floor(
                    remainingMilliseconds /
                    1000
                );


            return {
                years,
                months,
                days,
                hours,
                minutes,
                seconds,
                complete: false
            };
        }


        /* ==========================================================
           DISPLAY
        ========================================================== */

        function singularOrPlural(
            value,
            singular,
            plural
        ) {

            return value === 1
                ? singular
                : plural;
        }


        function createUnit(
            value,
            singular,
            plural
        ) {

            const unit =
                document.createElement("div");

            unit.className = "unit";


            const number =
                document.createElement("span");

            number.className = "value";
            number.textContent = value;


            const label =
                document.createElement("span");

            label.className = "label";

            label.textContent =
                singularOrPlural(
                    value,
                    singular,
                    plural
                );


            unit.appendChild(number);
            unit.appendChild(label);


            return unit;
        }


        let retirementCelebrationStarted = false;


        function updateCountdown() {

            const now =
                new Date();


            const remaining =
                getTimeRemaining(
                    now,
                    RETIREMENT_DATE
                );


            /* =========================
               RETIRED
            ========================== */

            if (remaining.complete) {

                countdown.className =
                    "countdown is-retired";


                countdown.setAttribute(
                    "aria-label",
                    "Retired"
                );


                retiredElement.setAttribute(
                    "aria-hidden",
                    "false"
                );


                unitsContainer.innerHTML = "";


                if (!retirementCelebrationStarted) {

                    retirementCelebrationStarted = true;

                    startFireworks();
                }


                return;
            }


            retiredElement.setAttribute(
                "aria-hidden",
                "true"
            );


            const allUnits = [

                {
                    value: remaining.years,
                    singular: "Year",
                    plural: "Years"
                },

                {
                    value: remaining.months,
                    singular: "Month",
                    plural: "Months"
                },

                {
                    value: remaining.days,
                    singular: "Day",
                    plural: "Days"
                },

                {
                    value: remaining.hours,
                    singular: "Hour",
                    plural: "Hours"
                },

                {
                    value: remaining.minutes,
                    singular: "Minute",
                    plural: "Minutes"
                },

                {
                    value: remaining.seconds,
                    singular: "Second",
                    plural: "Seconds"
                }

            ];


            let firstVisibleIndex =
                allUnits.findIndex(
                    unit => unit.value > 0
                );


            if (firstVisibleIndex === -1) {

                firstVisibleIndex =
                    allUnits.length - 1;

            }


            const visibleUnits =
                allUnits.slice(
                    firstVisibleIndex
                );


            countdown.className =
                `countdown count-${visibleUnits.length}`;


            unitsContainer.innerHTML = "";


            visibleUnits.forEach(unit => {

                unitsContainer.appendChild(

                    createUnit(
                        unit.value,
                        unit.singular,
                        unit.plural
                    )

                );

            });


            const accessibleText =
                visibleUnits
                    .map(unit =>

                        `${unit.value} ${
                            singularOrPlural(
                                unit.value,
                                unit.singular,
                                unit.plural
                            )
                        }`

                    )
                    .join(", ");


            countdown.setAttribute(
                "aria-label",
                `Retirement countdown: ${accessibleText}`
            );
        }


        /* ==========================================================
           TIMER
        ========================================================== */

        function startCountdown() {

            updateCountdown();


            const millisecondsUntilNextSecond =
                1000 -
                (Date.now() % 1000) +
                15;


            setTimeout(
                startCountdown,
                millisecondsUntilNextSecond
            );
        }


        /* ==========================================================
           FIREWORKS
        ========================================================== */

        const fireworksCanvas =
            document.getElementById("fireworksCanvas");

        const fireworksContext =
            fireworksCanvas.getContext("2d");


        const fireworks = [];

        const particles = [];


        let fireworksAnimationId = null;

        let fireworksStartTime = null;

        let lastLaunchTime = 0;


        const reduceMotion =
            window.matchMedia(
                "(prefers-reduced-motion: reduce)"
            );


        function resizeFireworksCanvas() {

            const ratio =
                window.devicePixelRatio || 1;


            fireworksCanvas.width =
                window.innerWidth * ratio;


            fireworksCanvas.height =
                window.innerHeight * ratio;


            fireworksCanvas.style.width =
                window.innerWidth + "px";


            fireworksCanvas.style.height =
                window.innerHeight + "px";


            fireworksContext.setTransform(
                ratio,
                0,
                0,
                ratio,
                0,
                0
            );
        }


        window.addEventListener(
            "resize",
            resizeFireworksCanvas
        );


        resizeFireworksCanvas();


        /* =========================
           FIREWORK ROCKET
        ========================== */

        class Firework {

            constructor() {

                this.x =
                    Math.random() *
                    window.innerWidth;


                this.y =
                    window.innerHeight + 20;


                this.targetY =
                    window.innerHeight *
                    (
                        0.10 +
                        Math.random() * 0.50
                    );


                this.speed =
                    8 +
                    Math.random() * 4;


                this.color =
                    randomFireworkColor();


                this.previousY =
                    this.y;

            }


            update() {

                this.previousY =
                    this.y;


                this.y -=
                    this.speed;


                if (
                    this.y <=
                    this.targetY
                ) {

                    createExplosion(
                        this.x,
                        this.y,
                        this.color
                    );

                    return false;
                }


                return true;
            }


            draw() {

                fireworksContext.beginPath();

                fireworksContext.moveTo(
                    this.x,
                    this.previousY
                );

                fireworksContext.lineTo(
                    this.x,
                    this.y
                );

                fireworksContext.strokeStyle =
                    this.color;

                fireworksContext.lineWidth =
                    2;

                fireworksContext.stroke();
            }
        }


        /* =========================
           FIREWORK PARTICLE
        ========================== */

        class Particle {

            constructor(
                x,
                y,
                color
            ) {

                this.x = x;
                this.y = y;


                const angle =
                    Math.random() *
                    Math.PI *
                    2;


                const speed =
                    2 +
                    Math.random() * 7;


                this.velocityX =
                    Math.cos(angle) *
                    speed;


                this.velocityY =
                    Math.sin(angle) *
                    speed;


                this.gravity =
                    0.06;


                this.friction =
                    0.985;


                this.alpha =
                    1;


                this.decay =
                    0.010 +
                    Math.random() * 0.014;


                this.color =
                    color;


                this.size =
                    1.5 +
                    Math.random() * 2.5;

            }


            update() {

                this.velocityX *=
                    this.friction;


                this.velocityY *=
                    this.friction;


                this.velocityY +=
                    this.gravity;


                this.x +=
                    this.velocityX;


                this.y +=
                    this.velocityY;


                this.alpha -=
                    this.decay;


                return this.alpha > 0;
            }


            draw() {

                fireworksContext.globalAlpha =
                    this.alpha;


                fireworksContext.beginPath();


                fireworksContext.arc(
                    this.x,
                    this.y,
                    this.size,
                    0,
                    Math.PI * 2
                );


                fireworksContext.fillStyle =
                    this.color;


                fireworksContext.fill();


                fireworksContext.globalAlpha =
                    1;
            }
        }


        function randomFireworkColor() {

            const colors = [

                "#ff3b30",
                "#ff9500",
                "#ffcc00",
                "#34c759",
                "#00c7be",
                "#0a84ff",
                "#5e5ce6",
                "#bf5af2",
                "#ff2d55",
                "#ffffff"

            ];


            return colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];
        }


        function createExplosion(
            x,
            y,
            color
        ) {

            const particleCount =
                window.innerWidth < 700
                    ? 45
                    : 70;


            for (
                let i = 0;
                i < particleCount;
                i++
            ) {

                particles.push(

                    new Particle(
                        x,
                        y,
                        color
                    )

                );

            }
        }


        function launchFirework() {

            fireworks.push(
                new Firework()
            );
        }


        function animateFireworks(timestamp) {

            fireworksContext.clearRect(
                0,
                0,
                window.innerWidth,
                window.innerHeight
            );


            if (!fireworksStartTime) {

                fireworksStartTime =
                    timestamp;
            }


            const elapsed =
                timestamp -
                fireworksStartTime;


            /*
                First 12 seconds:
                lots of fireworks.

                After that:
                slower ongoing celebration.
            */

            const launchInterval =
                elapsed < 12000
                    ? 350
                    : 1100;


            if (
                timestamp -
                lastLaunchTime >
                launchInterval
            ) {

                launchFirework();

                lastLaunchTime =
                    timestamp;
            }


            /* ROCKETS */

            for (
                let i =
                    fireworks.length - 1;
                i >= 0;
                i--
            ) {

                const firework =
                    fireworks[i];


                firework.draw();


                if (!firework.update()) {

                    fireworks.splice(
                        i,
                        1
                    );
                }
            }


            /* PARTICLES */

            for (
                let i =
                    particles.length - 1;
                i >= 0;
                i--
            ) {

                const particle =
                    particles[i];


                particle.draw();


                if (!particle.update()) {

                    particles.splice(
                        i,
                        1
                    );
                }
            }


            fireworksAnimationId =
                requestAnimationFrame(
                    animateFireworks
                );
        }


        function startFireworks() {

            /*
                Respect accessibility setting:
                if reduced motion is enabled,
                RETIRED still appears but fireworks do not.
            */

            if (reduceMotion.matches) {

                return;
            }


            if (fireworksAnimationId) {

                return;
            }


            /*
                Immediate burst so the celebration
                starts as soon as RETIRED appears.
            */

            for (
                let i = 0;
                i < 5;
                i++
            ) {

                setTimeout(
                    launchFirework,
                    i * 180
                );
            }


            fireworksAnimationId =
                requestAnimationFrame(
                    animateFireworks
                );
        }


        /* ==========================================================
           START
        ========================================================== */

        startCountdown();

    </script>

</body>
</html>
